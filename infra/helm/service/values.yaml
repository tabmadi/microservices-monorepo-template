# Default values for a backend service. Every per-env values file overrides on top.
# See ADR-0002 (layout), ADR-0004 (chart shape), ADR-0006 (Temporal worker),
# ADR-0007 (migrations), ADR-0010 (auth), ADR-0011 (observability).

# Required: the service slug (used for resource names and label values).
name: ""

# Server image (cmd/server). Pin by a concrete git SHA tag (dev/staging) or, in
# prod, by digest (ADR-0002, ADR-0013). Moving tags are lint-forbidden.
image:
  repository: ""        # e.g. ghcr.io/tabmadi/microservices-monorepo-template/catalog-server
  tag: ""               # e.g. 4f9dbcb12 (git SHA); dev/staging
  digest: ""            # e.g. sha256:… ; prod pins by digest (set by promote-on-release)
  pullPolicy: IfNotPresent

# Worker image (cmd/worker). Disabled by default; enable for services that own workflows.
worker:
  enabled: false
  image:
    repository: ""      # e.g. .../catalog-worker
    tag: ""             # SAME sha as the server image (dev/staging)
    digest: ""          # SAME digest as the server image (prod)
  replicas: 1
  resources:
    requests: { cpu: "50m",  memory: "64Mi" }
    limits:   { cpu: "500m", memory: "256Mi" }

  # Graceful drain on rollout (ADR-0006). On SIGTERM the worker stops polling and
  # waits up to stopTimeoutSeconds for its in-flight Activities to finish; the SDK
  # default is 0s, i.e. abandon them and let every one time out and retry.
  #
  # terminationGracePeriodSeconds is DERIVED (stopTimeoutSeconds + the buffer
  # below) rather than configured separately, because the invariant that kubelet
  # must wait strictly longer than the worker is the whole point: set the grace
  # period lower and SIGKILL lands mid-drain, which is the exact failure the stop
  # timeout exists to prevent. Raise the buffer, not the grace period.
  stopTimeoutSeconds: 25
  terminationGraceBufferSeconds: 10

  # Worker Deployment Versioning (ADR-0006). Pins each Workflow Execution to the
  # Deployment Version that started it, so a deploy cannot break work already in
  # flight and workflow.GetVersion patching is not needed.
  #
  # When on, the worker is a `WorkerDeployment` CR and the Temporal Worker
  # Controller (infra/helm/platform/temporal-worker-controller) reconciles one
  # Deployment per Build ID. That is what makes the pin real: the previous
  # version keeps its pods until Temporal reports it Drained, so a Workflow
  # pinned to it still has somewhere to run. A plain rolling Deployment deletes
  # those pods the moment the rollout finishes, which strands exactly the work
  # versioning was meant to protect.
  #
  # Turning this OFF is a real decision, not a default: unversioned workers make
  # every Workflow-code change a potential non-determinism error for executions
  # that predate the deploy. It exists as a switch because a service that needs
  # Temporal sessions cannot use versioning (the SDK forbids the combination).
  versioning:
    enabled: true
    # Promote a new version as soon as its pods are ready. See the template for
    # why this, and not a Progressive ramp, is the platform default.
    rollout:
      strategy: AllAtOnce
    # Keep a drained version's pods for an hour, and the Deployment itself for a
    # day, before reclaiming them.
    sunset:
      scaledownDelay: 1h
      deleteDelay: 24h

server:
  replicas: 2
  port: 8080
  adminPort: 9090       # pprof + livez/readyz + metrics (ADR-0011)
  resources:
    requests: { cpu: "50m",  memory: "64Mi" }
    limits:   { cpu: "500m", memory: "256Mi" }

# Database migrations (ADR-0007) run as a dbmate initContainer on the server pod,
# from the service image itself (it bakes the static dbmate binary + /db/migrations).
migrations:
  enabled: true

# Temporal wiring for a versioned worker. `connectionRef` names the `Connection`
# CR the platform chart renders once (infra/helm/platform/temporal-worker-
# controller); the controller reads the frontend address from there and injects
# it into the worker pods, so the endpoint is defined in exactly one place.
temporal:
  connectionRef: "platform-temporal"
  namespace: "default"

# Standard observability env (ADR-0011). The shared library reads these.
otel:
  endpoint: "http://otel-collector.platform.svc.cluster.local:4317"
  sampling: "parentbased_traceidratio=0.1"
  # Deployment environment. Anything other than "" / "dev" / "local" makes the
  # shared library ship logs to OTLP only (no stdout), avoiding double-collection.
  # Per-env GitOps values may override (e.g. "staging"); local flips it to "local".
  deployEnv: "prod"

# Ingress through Traefik (ADR-0003, ADR-0017). The API is a flat resource
# namespace: `resources` lists the resource segments this service owns at the
# edge; each becomes a `/api/<resource>` route and the shared `/api` prefix is
# stripped, so the service serves them at root and its identity stays out of the
# URL. Exactly one service may own a given resource (CI-linted, ADR-0008).
ingress:
  enabled: true
  host: ""              # set per env, e.g. dev.example.com
  resources: []         # e.g. [products] for catalog, [orders], [orgs], [charges]
  pathPrefix: ""        # literal-prefix fallback for non-API surfaces (frontend "/")

# References to SOPS-decrypted Kubernetes Secrets (ADR-0005).
# The sops-operator materialises these from infra/gitops/<env>/secrets/<svc>.enc.yaml.
secrets:
  envFrom: []           # list of Secret names mounted via envFrom
  files: []             # list of {name, mountPath, items} mounted as volumes

# Extra env vars, merged into both server and worker.
env: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532      # distroless static "nonroot"
  fsGroup: 65532

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# NetworkPolicy is default-deny by default (ADR-0003). Service-specific
# allowances go here.
networkPolicy:
  enabled: true
  allowFromGateway: true
  egressDNS: true
  # Other services (by slug) allowed to call this one on the server port.
  # e.g. catalog/payment list `orders` here; orders accepts no inbound svc calls.
  allowFrom: []
