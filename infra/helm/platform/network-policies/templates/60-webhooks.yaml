## Admission/conversion webhooks are called BY the Kubernetes API server. Without
## these allows a namespace-wide default-deny silently breaks cert issuance and
## CNPG cluster reconciliation (the apiserver → webhook call times out).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cert-manager-webhook
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: webhook
      app.kubernetes.io/instance: cert-manager
  ingress:
    - fromEntities: [kube-apiserver]
      toPorts:
        - ports: [{ port: "10250", protocol: TCP }]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cnpg-webhook
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: cloudnative-pg
  ingress:
    - fromEntities: [kube-apiserver]
      toPorts:
        - ports: [{ port: "9443", protocol: TCP }]
---
## Temporal Worker Controller (ADR-0006). Its WorkerResourceTemplate validating
## webhook is always on — not optional like the WorkerDeployment one — so the
## apiserver must reach 9443 or every WorkerResourceTemplate write hangs.
##
## Egress needs nothing here: the controller only talks to the Kubernetes API and
## the Temporal frontend, both already allowed by 00-baseline (kube-apiserver /
## host / remote-node, and intra-namespace to temporal-frontend).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: temporal-worker-controller-webhook
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: temporal-worker-controller
  ingress:
    - fromEntities: [kube-apiserver]
      toPorts:
        - ports: [{ port: "9443", protocol: TCP }]
