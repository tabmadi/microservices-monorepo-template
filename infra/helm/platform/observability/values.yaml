# Observability backend (ADR-0011): Grafana + Loki/Tempo (monolithic single-binary
# mode) + Prometheus (Core metrics, local TSDB) + a single OTel Collector DaemonSet.
# Log/trace durability is the off-cluster bucket (ADR-0003); access keys come from
# the SOPS-decrypted `observability-bucket` Secret (ADR-0005). Sizing here is the
# dev/staging default (single replica); prod bumps Loki/Tempo to 2 replicas in
# gitops/platform/prod/values.yaml. The metrics Scale swap is Mimir
# (docs/operational-surface.md).

# Off-cluster object storage. Endpoint + bucket names are wired per backend
# below; override the endpoint per environment in the GitOps platform values.
opentelemetry-collector:
  # One tier: a DaemonSet on every node. Services send OTLP to localhost:4317;
  # the agent batches, enriches with k8s attributes, head-samples, and exports
  # directly to Loki/Prometheus/Tempo. There is no separate gateway deployment.
  mode: daemonset
  fullnameOverride: otel-collector
  # contrib distro: required by the kubernetesAttributes preset (k8sattributes
  # processor) and the `faro` receiver below (faroreceiver landed in contrib 0.128.0).
  # The chart's default image is the core collector, so the repo is overridden; the
  # tag is pinned to the chart's appVersion (0.154.0) to keep config schema + binary
  # aligned — see the chart dependency version in Chart.yaml.
  image: { repository: otel/opentelemetry-collector-contrib, tag: "0.154.0" }
  # logsCollection is the ADR-0011 filelog path: the agent tails /var/log/pods
  # via the chart's filelog receiver (container parser, collector's own logs
  # excluded) so PLATFORM workloads that only write stdout — postgres, temporal,
  # grafana, lowdefy, … — land in Loki too. Repo services push logs over OTLP
  # from the SDK (libs/go/observability) and write no stdout in-cluster, so the
  # two paths never double-ingest. k8sattributes stamps service.name from
  # app.kubernetes.io/name, so these logs match {service_name="…"} on the
  # service-detail dashboard like everything else.
  presets:
    kubernetesAttributes: { enabled: true }
    logsCollection: { enabled: true }
  # RBAC for the kubeletstats receiver (added to the metrics pipeline below): the
  # kubelet's /stats/summary endpoint authorizes against the nodes/stats subresource.
  # The kubernetesAttributes preset creates the ClusterRole (pods/namespaces/nodes);
  # these rules are APPENDED to it, so no separate binding is needed.
  clusterRole:
    rules:
      - apiGroups: [""]
        resources: ["nodes/stats", "nodes/proxy"]
        verbs: ["get", "list", "watch"]
      # PVC/PV reads for the kubeletstats `volume` metric group's k8s_api_config,
      # which turns per-volume series keyed by the in-pod name ("data", shared by
      # every StatefulSet) into series keyed by the actual claim.
      - apiGroups: [""]
        resources: ["persistentvolumeclaims", "persistentvolumes"]
        verbs: ["get", "list", "watch"]
  # Browser beacons reach the collector through a ClusterIP Service (Traefik →
  # otel-collector:8027). Services still emit to localhost:4317, not this Service.
  # In daemonset mode the chart omits the Service unless explicitly enabled.
  service: { enabled: true }
  # Expose the Faro receiver port on that Service so Traefik can route to it
  # (infra/gateway/frontend-observability.yaml, ADR-0014).
  ports:
    faro: { enabled: true, containerPort: 8027, servicePort: 8027, protocol: TCP }
  config:
    receivers:
      otlp: { protocols: { grpc: { endpoint: 0.0.0.0:4317 }, http: { endpoint: 0.0.0.0:4318 } } }
      # Browser RUM from the frontend's Grafana Faro agent (ADR-0014). Emits
      # web traces and RUM logs/events; fed into the traces + logs pipelines
      # below so browser signals land in the same Tempo/Loki as services.
      faro: { endpoint: 0.0.0.0:8027 }
      # Hubble flow metrics off the cilium-agent (ADR-0011) — the ONE scrape in this
      # repo. Prometheus itself ships `scrape_configs: []` with no ServiceAccount and
      # no RBAC, because the invariant is "everything reaches Prometheus as an OTLP
      # push from this collector". Teaching Prometheus kubernetes_sd would mean
      # inventing RBAC for it and breaking that invariant, so the collector scrapes
      # and re-exports instead.
      #
      # Node-local static target, not service discovery: this collector is a DaemonSet
      # and so is cilium-agent (hostNetwork), so each pod scrapes the agent on its OWN
      # node via the chart-injected K8S_NODE_IP. No RBAC, no cross-node traffic, and no
      # scraping every agent from every collector.
      prometheus/hubble:
        config:
          scrape_configs:
            - job_name: hubble
              scrape_interval: 30s
              static_configs:
                - targets: ["${env:K8S_NODE_IP}:9965"]
      # Per-pod/container/node CPU & memory from the local kubelet's Summary API
      # (ADR-0025 POC — the resource panels on the service-detail dashboard). Same
      # node-local pattern as the hubble scrape: this DaemonSet pod reads ONLY its
      # own node's kubelet via the chart-injected K8S_NODE_IP, authenticating with
      # the pod ServiceAccount token (clusterRole.rules below grant nodes/stats).
      # insecure_skip_verify: the kubelet serving cert is not signed for the bare
      # node IP, and this is node-local traffic that never leaves the host.
      kubeletstats:
        collection_interval: 20s
        auth_type: serviceAccount
        endpoint: "https://${env:K8S_NODE_IP}:10250"
        insecure_skip_verify: true
        # `volume` is the one that protects the data tier. Postgres, Loki, Tempo,
        # Prometheus and MinIO all write to PVCs, and a full PVC does not evict a
        # pod or fail a probe — Postgres simply starts refusing writes. Nothing
        # else in this stack reports PVC free space: kubelet knows it, and this is
        # the only receiver that asks.
        metric_groups: [pod, container, node, volume]
        # Resolve volumes to their PersistentVolumeClaim / PV names. Without this
        # the volume series are keyed by the in-pod volume name ("data"), which is
        # the same string on every StatefulSet and therefore useless for alerting
        # on a specific claim. Needs the PVC/PV read grants in clusterRole.rules.
        k8s_api_config:
          auth_type: serviceAccount
        # Usage-vs-limit ratios (off by default). Computed from the pod spec the
        # receiver reads via the kubelet's /pods endpoint (nodes/proxy, granted
        # above). Pod-level limit_utilization is only emitted when EVERY
        # container in the pod declares that limit — pods without limits simply
        # show a blank cell on the Applications dashboard, not a zero.
        metrics:
          k8s.pod.memory_limit_utilization: { enabled: true }
          k8s.pod.cpu_limit_utilization: { enabled: true }
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
      batch: {}
      # Head sampling at the agent (ADR-0011). Error traces are kept at 100% by
      # the services' parentbased SDK sampler (OTEL_TRACES_SAMPLER_ARG); this
      # caps healthy-trace volume. Tail sampling needs the gateway tier and is a
      # per-project flag — not deployed here.
      probabilistic_sampler:
        sampling_percentage: 5
    exporters:
      otlphttp/tempo:      { endpoint: http://tempo.platform.svc.cluster.local:4318 }
      # Prometheus native OTLP receiver (--web.enable-otlp-receiver). The otlphttp
      # exporter appends /v1/metrics to this base path.
      otlphttp/prometheus: { endpoint: http://prometheus.platform.svc.cluster.local:9090/api/v1/otlp }
      # Loki's native OTLP endpoint — the standalone `loki` exporter was removed
      # from the Collector (≤ v0.112), so push logs over OTLP instead.
      otlphttp/loki:       { endpoint: http://loki.platform.svc.cluster.local:3100/otlp }
    service:
      pipelines:
        traces:  { receivers: [otlp, faro], processors: [memory_limiter, probabilistic_sampler, batch], exporters: [otlphttp/tempo] }
        metrics: { receivers: [otlp, prometheus/hubble, kubeletstats], processors: [memory_limiter, batch], exporters: [otlphttp/prometheus] }
        logs:    { receivers: [otlp, faro], processors: [memory_limiter, batch], exporters: [otlphttp/loki] }

grafana:
  fullnameOverride: grafana
  adminPassword: ""                # supplied via SOPS-decrypted Secret in prod
  # Served at the ROOT of its own ops origin grafana.ops.<host> (ADR-0017), not
  # under a /grafana path — so serve_from_sub_path is off. Each env overrides
  # root_url with its external origin (the local overlay sets the :8443 edge).
  grafana.ini:
    server:
      serve_from_sub_path: false
      root_url: "%(protocol)s://%(domain)s/"
    # The ops edge is the authentication gate (Oathkeeper: an AAL2 operator holding
    # dashboard:grafana#view, ADR-0017). Grafana trusts it and serves anonymously
    # instead of running a second, redundant login that would redirect to /login and
    # never render. Only AAL2 operators ever reach this origin.
    auth:
      disable_login_form: true
    "auth.anonymous":
      enabled: true
      org_role: Admin
    # Skip the "Welcome to Grafana" home page and land operators on a real
    # dashboard. dashboardsConfigMaps.default (grafana-dashboards) mounts at
    # /var/lib/grafana/dashboards/default, so overview.json is served there.
    # Overview is the L1 landing page (ADR-0026): firing alerts, cluster-wide
    # golden signals, per-service SLO status, and platform-dependency one-liners —
    # every panel either turns red or links down to Applications / Service detail /
    # Platform components / policy-denials.
    dashboards:
      default_home_dashboard_path: /var/lib/grafana/dashboards/default/overview.json
    # No phone-home: version/plugin update checks and usage analytics are the only
    # reason Grafana reaches the internet (seen in Hubble as grafana -> <gcp-ip>:443).
    analytics:
      reporting_enabled: false
      check_for_updates: false
      check_for_plugin_updates: false
    # Grafana 11.4+ ships the drilldown apps (Explore Logs/Traces/Metrics, Pyroscope)
    # as *preinstalled* plugins and fetches them from grafana.com on startup — which
    # fails on an air-gapped/proxied cluster ("Failed to install plugin … context
    # deadline exceeded"). check_for_plugin_updates only governs update checks, not
    # this preinstall; we don't use those apps, so disable it for a clean startup.
    # public_key_retrieval_disabled stops the separate startup call that pulls plugin
    # signature keys from grafana.com/api/plugins/ci/keys (also proxy-blocked); the
    # bundled plugins verify against the keys embedded in the Grafana binary.
    plugins:
      preinstall_disabled: true
      public_key_retrieval_disabled: true
  datasources:
    datasources.yaml:
      apiVersion: 1
      # Fixed uids: a provisioned datasource without an explicit uid gets a random
      # one, and dashboard data-links reference datasources by uid — so pin them
      # all. Dashboards still reference these by NAME ("Prometheus"/"Loki"/
      # "Tempo"), which keeps working alongside the uids.
      datasources:
        - { name: Prometheus, uid: prometheus, type: prometheus, url: http://prometheus.platform.svc.cluster.local:9090 }
        - { name: Loki,       uid: loki,       type: loki,       url: http://loki.platform.svc.cluster.local:3100 }
        - { name: Tempo,      uid: tempo,      type: tempo,      url: http://tempo.platform.svc.cluster.local:3200 }
        # Pyroscope (ADR-0025 POC — continuous profiling). Backs the flame-graph
        # panel on the service-detail dashboard; profiles are pushed here by the
        # Alloy agent (templates/alloy.yaml).
        - { name: Pyroscope, uid: pyroscope, type: grafana-pyroscope-datasource, url: http://pyroscope.platform.svc.cluster.local:4040 }
  # BOTH halves are required. `dashboardsConfigMaps` only MOUNTS the JSON files;
  # without a matching `dashboardProviders` entry Grafana never scans that directory,
  # so the dashboards exist on disk and are invisible in the UI — `/api/search`
  # returns []. That was the state until 2026-07-20: `service-red.json` appeared to
  # work only because grafana.ini points `default_home_dashboard_path` straight at
  # the file, which bypasses provisioning entirely. The provider name must match the
  # dashboardsConfigMaps key (`default`), which is also the mount subdirectory.
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          orgId: 1
          folder: ""
          type: file
          disableDeletion: false
          editable: false      # dashboards are git artifacts (ADR-0011): PRs, not UI edits
          options:
            path: /var/lib/grafana/dashboards/default
  dashboardsConfigMaps:
    default: grafana-dashboards     # populated from infra/observability/dashboards/

# Loki — single-binary monolithic (-target=all), bucket-backed (ADR-0011).
loki:
  # Pin the service name to `loki` (not the release-prefixed `observability-loki`)
  # so the OTel exporter and Grafana datasource below — and prod — reach it at
  # loki.<ns>.svc:3100. Mirrors tempo/prometheus, which also fix their names.
  fullnameOverride: loki
  deploymentMode: SingleBinary
  loki:
    # Single-tenant (ADR-0011): no X-Scope-OrgID required. Without this the chart
    # defaults to multi-tenant and every header-less query (incl. Grafana's
    # datasource health check) 401s with "no org id".
    auth_enabled: false
    # Don't phone home usage stats to stats.grafana.org — the only reason loki
    # makes an external egress connection (seen in Hubble as loki -> <gcp-ip>:443).
    analytics: { reporting_enabled: false }
    commonConfig: { replication_factor: 1 }
    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: s3
          schema: v13
          index: { prefix: loki_index_, period: 24h }
    storage:
      type: s3
      bucketNames: { chunks: loki-chunks, ruler: loki-ruler, admin: loki-admin }
      s3:
        endpoint: s3.eu-central-1.amazonaws.com
        region: eu-central-1
        s3ForcePathStyle: true
        # access_key_id / secret_access_key are left empty so Loki's S3 client uses
        # the AWS SDK env credentials injected below from the observability-bucket Secret.
  singleBinary:
    replicas: 1
    extraEnvFrom:
      - secretRef: { name: observability-bucket }
  # Disable the microservices read/write/backend topology.
  read: { replicas: 0 }
  write: { replicas: 0 }
  backend: { replicas: 0 }
  chunksCache: { enabled: false }
  resultsCache: { enabled: false }
  # The nginx gateway fronts the distributed read/write/backend split; in
  # SingleBinary mode the OTel collector pushes and Grafana queries the loki
  # service directly, so it is dead weight. The chart (7.x) also gives it a hard
  # pod-anti-affinity that can't schedule on a single-node local cluster.
  gateway: { enabled: false }
  # loki-canary is a synthetic log-probe DaemonSet (+ its helm test) used to
  # measure ingest latency; not something this template needs to run. These two
  # toggles are the loki chart's own templates, so a values override works.
  lokiCanary: { enabled: false }
  test: { enabled: false }
  # NOTE: the loki chart also bundles minio, rollout-operator and
  # grafana-agent-operator as *grandchild* subcharts, which Helm renders even
  # when their conditions are set false (nested-condition limitation). They are
  # all dead weight here — loki uses the shared platform MinIO, runs one replica,
  # and self-telemetry goes through the OTel collector — so they are physically
  # stripped from the vendored charts/loki-7.0.0.tgz (see observability/Chart.yaml).

# Tempo — single-binary monolithic chart, bucket-backed.
tempo:
  # Pin the service name to `tempo` so the OTel exporter (tempo:4318) and Grafana
  # datasource (tempo:3200) resolve it, instead of the release-prefixed default.
  fullnameOverride: tempo
  replicas: 1
  tempo:
    reportingEnabled: false
    # Metrics-generator stays OFF (chart default). Its service_graphs processor was
    # evaluated for a Grafana Node-Graph service map and rejected (ADR-0025):
    # pairing is traffic-dependent (only CLIENT/SERVER span pairs processed in one
    # instance produce edges) and it yields ~1 edge here. The service map is Hubble
    # UI's job. Enabling it would also need Prometheus's
    # --web.enable-remote-write-receiver flag and a tempo→prometheus:9090
    # NetworkPolicy rule, neither of which is deployed.
    # S3 creds (AWS_ACCESS_KEY_ID/SECRET) from the observability-bucket Secret;
    # access_key/secret_key under s3 are left empty for the AWS SDK env fallback.
    extraEnvFrom:
      - secretRef: { name: observability-bucket }
    storage:
      trace:
        backend: s3
        s3:
          bucket: tempo-traces
          endpoint: s3.eu-central-1.amazonaws.com
          region: eu-central-1
          # access_key / secret_key come from the observability-bucket Secret.

# Prometheus — the Core-tier metrics store: one Deployment, local TSDB, native
# OTLP ingest, no object storage. Rendered by templates/prometheus.yaml (ConfigMap
# + Deployment + Service), not a subchart. The object-storage-backed, horizontally
# scalable variant is the Mimir Scale swap (docs/operational-surface.md).
prometheus:
  image: prom/prometheus:v3.1.0
  replicas: 1
  httpPort: 9090
  # Local-TSDB retention. A project needing long retention takes the Mimir swap.
  retention: 15d
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits:   { cpu: "1",    memory: "1Gi" }

# Pyroscope (ADR-0025 POC — continuous profiling, the fourth signal). Rendered by
# templates/pyroscope.yaml as a single-binary monolith (-target=all) with
# filesystem storage on an emptyDir — the POC minimum. A real deployment points its
# storage at the off-cluster bucket like Loki/Tempo and raises retention. Profiles
# are PUSHED here by the Alloy agent (below), which pulls each Go service's pprof.
pyroscope:
  image: grafana/pyroscope:1.14.0
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits:   { cpu: "1",    memory: "1Gi" }

# Grafana Alloy (ADR-0025 POC) — the pprof-scraping agent the withdrawn profiling
# flag always implied. Rendered by templates/alloy.yaml. It discovers platform pods,
# keeps those exposing the `admin` port (the pprof endpoint obs.Init serves, ADR-0011),
# scrapes CPU/heap/goroutine profiles, and pushes them to Pyroscope. No service change
# and no new ingress rule: services already allow platform-namespace ingress to the
# admin port, and the baseline NetworkPolicy already allows intra-namespace egress.
alloy:
  image: grafana/alloy:v1.11.0
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

# Cluster-state metrics singleton (templates/otel-cluster.yaml): k8s_cluster
# receiver → desired/available replicas, restart counts, resource limits as
# series. Image matches the DaemonSet collector's contrib distro + tag so both
# collectors upgrade in lockstep.
otelCluster:
  image: otel/opentelemetry-collector-contrib:0.154.0
  resources:
    requests: { cpu: "50m",  memory: "128Mi" }
    limits:   { cpu: "200m", memory: "256Mi" }
