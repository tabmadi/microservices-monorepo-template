# OpenAPI 3.1 lint ruleset for all services (ADR-0008). Spectral-format ruleset,
# run by vacuum (`mise run lint:openapi`). `spectral:oas` is the built-in core ruleset.
extends:
  - "spectral:oas"

rules:
  # Style
  # Per-PROPERTY examples stay off: they are maintenance on every scaffolded field
  # for no consumer. Whole-response examples are the opposite — see
  # response-example-required below.
  oas3-missing-example: off
  operation-operationId: error
  operation-tag-defined: error
  oas3-server-not-example.com: warn
  info-contact: off
  info-license: off

  # Breaking-change hygiene — every operation must declare its security and a 2xx + 4xx response.
  operation-success-response: error

  # Naming conventions
  operation-operationId-valid-in-url:
    description: operationId must be camelCase, ASCII, no spaces
    given: $.paths.*[get,post,put,patch,delete].operationId
    severity: error
    then:
      function: pattern
      functionOptions:
        match: "^[a-z][a-zA-Z0-9]+$"

  # Enforce snake_case property names (this project's wire-format convention).
  # Disable the built-in camelCase rule and replace it with the snake_case
  # variant of the same function, so non-snake_case names still warn.
  camel-case-properties: off
  snake-case-properties:
    description: schema property names must be snake_case
    given: "$"
    resolved: true
    severity: warn
    then:
      function: oasCamelCaseProperties
      functionOptions:
        type: snake

  # Response examples are load-bearing, not documentation garnish (ADR-0029): the
  # API mock serves them verbatim to the UI development loop, and the Scalar
  # developer portal renders the same values — one investment, two consumers. Without
  # one, a mocked response is schema-generated: an unconstrained array legitimately
  # becomes `[]`, and an open object grows fields the real API never returns.
  #
  # The check runs on the RESOLVED document, so a $ref to a component schema that
  # carries an `example` satisfies it; an inline array schema needs its own (the
  # item's example says nothing about how many rows come back). 204s have no content
  # and are therefore out of scope by construction.
  response-example-required:
    description: every 2xx response schema must carry an `example` — the API mock serves it and the developer portal renders it
    given: $.paths.*[get,post,put,patch,delete].responses['200','201','202'].content.*.schema
    resolved: true
    severity: error
    then:
      field: example
      function: truthy

  # Every path must have a tag for grouping
  must-have-tag:
    description: every operation must have at least one tag
    given: $.paths.*[get,post,put,patch,delete]
    severity: error
    then:
      field: tags
      function: truthy

  # admin-gen markers (ADR-0012). The generator reads two `x-admin` markers: `crud`
  # on a tag (the resource group) and `action` on an operation. A value in the wrong
  # place — `crud` on an operation, or `action`/typo on a tag — is silently ignored
  # (no admin page), so pin each to its valid value.
  x-admin-operation-value:
    description: "operation-level x-admin must be `action` (resource CRUD is marked with x-admin: crud on the tag)"
    given: $.paths.*[*]['x-admin']
    severity: error
    then:
      function: enumeration
      functionOptions:
        values:
          - action
  x-admin-tag-value:
    description: "tag-level x-admin must be `crud` (per-operation actions use x-admin: action on the operation)"
    given: $.tags[*]['x-admin']
    severity: error
    then:
      function: enumeration
      functionOptions:
        values:
          - crud
