# Drift check (ADR-0002, ADR-0008): regenerate AND reformat everything, then fail if
# anything changed. The check is `mise run ci:gen`; why formatting is part of it,
# and not of `lint`, is documented at that task in .mise.toml.
name: ci-drift

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      # The check itself lives in `ci:gen` (.mise.toml) so this job and the lefthook
      # gen-drift hook cannot drift apart from each other. This step only translates
      # its exit code into a GitHub annotation.
      - name: Regenerate, reformat, fail on drift
        run: |
          if ! mise run ci:gen; then
            echo "::error::Generated or formatted artifacts are out of date. Run 'mise run ci:gen' and commit the result."
            exit 1
          fi
