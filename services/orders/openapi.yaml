openapi: 3.1.0
info: { title: orders, version: 0.1.0, description: Order checkout and saga orchestration service., x-audience: public }
servers: [{ url: /api }]   # flat resource namespace (ADR-0017); paths are globally unique
# `x-admin: crud` marks the resource group the admin generator (ADR-0012, tools/admin-gen)
# scaffolds pages for. Orders are saga-created and immutable, so the surface is
# list/detail (read) plus the `cancel` action below — no edit/delete.
tags: [{ name: orders, x-admin: crud }]
paths:
  /orders:
    get:
      operationId: listOrders
      # Listing every order is a back-office view, kept out of public docs (ADR-0008).
      x-audience: internal
      description: List all orders.
      tags: [orders]
      responses:
        "200":
          description: The order list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
                # Served verbatim by the API mock (ADR-0029). The statuses vary on
                # purpose: a list example with one status is how a UI ships with an
                # unstyled badge for every other one.
                example:
                  - { id: 2c9f0b71-5d64-4a0e-9b83-0f27f7f0d001, product_id: 6f7a1c48-1a9d-4b1e-9a2c-0f27f7f0c001, quantity: 2, total_cents: 259800, status: confirmed }
                  - { id: 2c9f0b71-5d64-4a0e-9b83-0f27f7f0d002, product_id: 6f7a1c48-1a9d-4b1e-9a2c-0f27f7f0c002, quantity: 1, total_cents: 89900, status: pending }
                  - { id: 2c9f0b71-5d64-4a0e-9b83-0f27f7f0d003, product_id: 6f7a1c48-1a9d-4b1e-9a2c-0f27f7f0c003, quantity: 4, total_cents: 59600, status: cancelled }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: checkout
      tags: [orders]
      description: Starts the Checkout Temporal saga (ADR-0006).
      requestBody:
        required: true
        description: The checkout to start.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutInput" }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowHandle" }
        default: { $ref: "#/components/responses/Error" }
  /orders/{id}:
    get:
      operationId: getOrder
      description: Fetch an order by id.
      tags: [orders]
      parameters: [{ name: id, in: path, required: true, description: Order id., schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } } }
        default: { $ref: "#/components/responses/Error" }
  /orders/{id}/cancel:
    post:
      operationId: cancelOrder
      # Operator action (ADR-0012): admin-gen emits an action button, not CRUD.
      # Edge-reachable first-party, out of public docs (ADR-0008 audience ladder).
      x-admin: action
      x-audience: internal
      description: Cancel an order. Starts the CancelOrder workflow (ADR-0006).
      tags: [orders]
      parameters: [{ name: id, in: path, required: true, description: Id of the order to cancel., schema: { type: string, format: uuid } }]
      responses:
        "202":
          description: Cancellation accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowHandle" }
        default: { $ref: "#/components/responses/Error" }
components:
  responses:
    Error:
      description: Error response
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      description: RFC 7807 problem document.
      required: [code, message]
      properties:
        code:    { type: string }
        message: { type: string }
        details: { type: object, additionalProperties: true }
    WorkflowHandle:
      type: object
      description: Handle to an async Temporal workflow run.
      required: [id, run_id, status]
      properties:
        id:     { type: string }
        run_id: { type: string }
        status: { type: string, enum: [running, completed, failed, cancelled] }
        result_url: { type: string, format: uri, description: "GET to fetch terminal status + result" }
      # `running` is the honest example: it is what the real 202 returns. Against the
      # API mock the poll never progresses (ADR-0029) — workflow progression is
      # exercised against real services, so build the pending state and stop there.
      example: { id: checkout-2c9f0b71-5d64-4a0e-9b83-0f27f7f0d001, run_id: 019a3f8c-6d21-7c4b-8e55-0f27f7f0e001, status: running, result_url: /api/orders/2c9f0b71-5d64-4a0e-9b83-0f27f7f0d001 }
    CheckoutInput:
      type: object
      description: Request body to start a checkout.
      required: [product_id, quantity]
      properties:
        product_id: { type: string, format: uuid }
        quantity:   { type: integer, minimum: 1 }
    Order:
      type: object
      description: A customer order.
      required: [id, product_id, quantity, total_cents, status]
      properties:
        id:          { type: string, format: uuid }
        product_id:  { type: string, format: uuid }
        quantity:    { type: integer }
        total_cents: { type: integer }
        status:      { type: string, enum: [pending, confirmed, failed, cancelled] }
      example: { id: 2c9f0b71-5d64-4a0e-9b83-0f27f7f0d001, product_id: 6f7a1c48-1a9d-4b1e-9a2c-0f27f7f0c001, quantity: 2, total_cents: 259800, status: confirmed }
